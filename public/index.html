<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Move Map</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Move Map</h1>
      <p class="tag">Play your way to moving day.</p>
    </div>
    <div class="controls">
      <label class="date">
        <span>Move date</span>
        <input id="moveDate" type="date" />
      </label>
      <div id="countdown" class="countdown" aria-live="polite"></div>
    </div>
  </header>

  <main class="layout">
    <section class="board-wrap" aria-labelledby="boardTitle">
      <div class="board-head">
        <h2 id="boardTitle">Your board</h2>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="progressText" class="progress-text"></span>
      </div>
      <p class="hint">Tap a tile to mark it done. Your token always waits on the next unfinished tile.</p>
      <ol id="board" class="board"></ol>
      <div id="win" class="win" hidden>Board complete. Enjoy the new place.</div>
      <button id="resetBoard" class="link" type="button">Reset board</button>
    </section>

    <section class="chat" aria-labelledby="chatTitle">
      <div class="chat-head">
        <h2 id="chatTitle">K's Move Bot</h2>
        <span id="mode" class="badge"></span>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
      <p id="sync" class="sync"></p>
      <div class="chips" id="chips">
        <button type="button" data-q="What should I do next?">What's next?</button>
        <button type="button" data-q="Break my next tile into small steps.">Break it down</button>
        <button type="button" data-q="Am I on track for my move date?">On track?</button>
      </div>
      <form id="form" class="form" autocomplete="off">
        <input id="input" type="text" maxlength="1000" placeholder="Ask about your move..." aria-label="Message to K's Move Bot" />
        <button id="send" type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer class="foot">
    <span id="schema"></span>
    <button id="clearChat" class="link" type="button">Clear chat</button>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
